name: build
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v3
        with:
        gradle-version: 8.8
      - run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: magiamod
          path: build/libs/*.jar
